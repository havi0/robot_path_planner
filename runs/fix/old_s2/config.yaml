world:
  width: 6.0
  height: 6.0
  obstacle_density: 0.15
  obstacle_size:
  - 0.3
  - 1.0
  goal_radius: 0.3
  min_start_goal_dist: 2.5
  start_goal_clearance: 0.35
  num_moving_obstacles: 0
  moving_obstacle_radius: 0.2
  moving_obstacle_speed: 0.2
robot:
  radius: 0.15
  control_dt: 0.25
  physics_substeps: 5
sensor:
  num_beams: 24
  fov_deg: 360
  max_range: 3.0
  noise_std: 0.0
  dropout_prob: 0.0
actions:
  forward:
  - 0.3
  - 0.0
  turn_left:
  - 0.0
  - 1.2
  turn_right:
  - 0.0
  - -1.2
  stop:
  - 0.0
  - 0.0
reward:
  goal: 10.0
  collision: -10.0
  step: -0.05
  progress_scale: 1.0
  stop_penalty: -0.5
  turn_reversal_penalty: -0.1
  proximity_threshold: 0.35
  proximity_penalty: -0.05
  safety_intervention: -0.1
randomization:
  enabled: true
  obstacle_density:
  - 0.05
  - 0.25
  linear_scale:
  - 0.9
  - 1.1
  angular_scale:
  - 0.9
  - 1.1
  motion_noise_std: 0.05
  sensor_noise_std:
  - 0.0
  - 0.03
  sensor_dropout_prob:
  - 0.0
  - 0.02
safety:
  max_linear_speed: 0.3
  max_angular_speed: 1.5
  max_linear_accel: 1.5
  max_angular_accel: 8.0
  stop_distance: 0.12
  lateral_margin: 0.05
  sensor_timeout: 0.5
  min_valid_beam_fraction: 0.5
  allow_reverse: false
dqn:
  hidden:
  - 128
  - 128
  lr: 0.00025
  gamma: 0.99
  batch_size: 128
  buffer_size: 200000
  learning_starts: 5000
  train_freq: 1
  target_update_interval: 2000
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 100000
  double_dqn: true
  grad_clip: 10.0
qlearning:
  alpha: 0.1
  gamma: 0.99
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_episodes: 4000
  episodes: 6000
training:
  seed: 2
  total_steps: 250000
  max_episode_steps: 400
  use_safety_shield: false
  eval_every: 10000
  eval_episodes: 100
  log_every_episodes: 50
  torch_threads: 1
evaluation:
  heldout_seed_offset: 1000000
  episodes_per_setting: 100
  densities:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  sensor_noise_levels:
  - 0.0
  - 0.02
  - 0.05
  - 0.1
  motion_noise_levels:
  - 0.0
  - 0.05
  - 0.1
  - 0.2
  planner_resolution: 0.05
  planner_inflation: 0.1
